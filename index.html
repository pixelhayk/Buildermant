<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Фабрика</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#141c17;font:14px system-ui,sans-serif;color:#e8efe9;touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;display:flex;justify-content:space-between;align-items:center;background:#000a;font-weight:600}
#hud span{cursor:pointer;padding:0 4px}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:#0c120ed9}
#bar button{flex:0 0 auto;min-width:62px;padding:5px 4px;border:2px solid #3a4a40;border-radius:10px;background:#1f2b24;color:inherit;font:inherit;font-size:12px;line-height:1.25}
#bar button.on{border-color:#ffd54a;background:#3a3514}
#bar b{display:block;font-size:20px;font-weight:400}
#bp{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:none;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;background:#0c120ef2;border:2px solid #4a6354;border-radius:14px}
#bp button{min-width:84px;padding:6px 4px;border:2px solid #3a4a40;border-radius:10px;background:#1f2b24;color:inherit;font:inherit;font-size:12px;line-height:1.25}
#bp button.on{border-color:#ffd54a;background:#3a3514}
#bp b{display:block;font-size:20px;font-weight:400}
#cf{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(92vw,380px);display:none;background:#17211b;border:2px solid #ffd54a;border-radius:14px;padding:12px;text-align:center;line-height:1.4}
#cf .r{display:flex;gap:8px;margin-top:10px}
#cf button{flex:1;padding:10px;border:2px solid #3a4a40;border-radius:10px;background:#1f2b24;color:inherit;font:inherit}
#cf #cy{background:#2f4a3a;border-color:#ffd54a}
#pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-55%);width:min(92vw,380px);max-height:70vh;overflow:auto;background:#17211b;border:2px solid #4a6354;border-radius:14px;padding:14px;display:none}
#pop h3{margin:0 0 8px;font-size:18px}
#ps{margin-bottom:10px;line-height:1.5;color:#b9c8bd}
#pop button{display:block;width:100%;margin:6px 0 0;padding:10px;border:2px solid #3a4a40;border-radius:10px;background:#1f2b24;color:inherit;font:inherit;text-align:left}
#pop button.on{border-color:#ffd54a}
#pc{text-align:center!important;background:#2f4a3a!important}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="m"></div><div id="f"></div><span id="nr" title="Новая игра">⟲</span></div>
<div id="toast"></div>
<div id="pop"><h3 id="pt"></h3><div id="ps"></div><div id="pr"></div><button id="pc">Закрыть</button></div>
<div id="cf"><div id="cq">Поставить хаб сюда?<br><small>Хаб ставится только один раз. Можно тапнуть в другое место, чтобы передвинуть.</small></div><div class="r"><button id="cy">Да, поставить</button><button id="cn">Отмена</button></div></div>
<div id="bp"></div>
<div id="bar"></div>
<script>
const N=300,DX=[1,0,-1,0],DY=[0,1,0,-1],ARR='→↓←↑';
// предметы: [название, цвет, цена продажи]
const I=[0,['Железная руда','#8a9db5',2],['Медная руда','#d9803f',2],['Уголь','#555',2],['Камень','#c9c3b5',2],
['Железный слиток','#dbe4f0',9],['Медный слиток','#ff9d5c',9],['Кирпич','#c0563b',7],['Сталь','#6f86a8',24],
['Гвозди','#eee',6],['Провод','#ff6b6b',6],['Шестерня','#9aa5b1',28],['Плата','#4cd37b',50],['Мотор','#f5c542',140],['Бревно','#8b5a2b',3],['Доски','#e0b97d',8],['Ящик','#a67c45',55],['Алмаз','#6fd0ff',40],['Астралит','#cfd8e6',55],['Изумруд','#3fdc7a',70]];
// рецепты: m — машина (s плавильня / w мастерская), in — вход, out — выход, q — кол-во, t — время, c — цена открытия
const R=[
{id:0,m:'s',n:'Железный слиток',in:{1:2},out:5,q:1,t:2,c:0},
{id:1,m:'s',n:'Медный слиток',in:{2:2},out:6,q:1,t:2,c:0},
{id:2,m:'s',n:'Кирпич',in:{4:2},out:7,q:1,t:2,c:150},
{id:3,m:'s',n:'Сталь',in:{5:1,3:1},out:8,q:1,t:3,c:300},
{id:4,m:'w',n:'Гвозди',in:{5:1},out:9,q:2,t:2,c:0},
{id:5,m:'w',n:'Провод',in:{6:1},out:10,q:2,t:2,c:0},
{id:6,m:'w',n:'Шестерня',in:{5:2},out:11,q:1,t:3,c:200},
{id:7,m:'w',n:'Плата',in:{10:2,5:1},out:12,q:1,t:4,c:500},
{id:8,m:'w',n:'Мотор',in:{11:1,10:2,8:1},out:13,q:1,t:6,c:1200},
{id:9,m:'l',n:'Доски',in:{14:1},out:15,q:2,t:2,c:0},
{id:10,m:'c',n:'Ящик',in:{15:2,9:2},out:16,q:1,t:3,c:250},
{id:11,m:'s',n:'Древесный уголь',in:{14:2},out:3,q:1,t:3,c:100}];
const C={hub:0,ext:25,belt:2,split:10,smelt:60,work:120,saw:80,carp:150};
const MT={smelt:'s',work:'w',saw:'l',carp:'c'};
const OB={4:'#4c5256',1:'#4a5663',2:'#6b4a2e',6:'#2c4a6b',7:'#4b5563',8:'#2d5a3d'},OX={1:0,2:1,6:2,7:3,8:4},IX={1:5,2:6,17:7,18:8,19:9},OI={5:14,6:17,7:18,8:19};
const OC=['','#8a9db5','#d9803f','#3a3a3a','#bdb7a6','#2f6b2f','#4aa8ff','#cfd8e6','#2fd16a'],ON=['','Железная руда','Медная руда','Уголь','Камень','Лес','Алмазная руда','Руда астралита','Изумрудная руда'];
const NM={ext:'Экстрактор',smelt:'Плавильня',work:'Мастерская',belt:'Лента',saw:'Лесопилка',carp:'Столярная',split:'Разветвитель',hub:'Хаб'};
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let dpr=1,W=0,H=0,seed,money=150,sold=0,tool='sel',cur=0,g,ore,bl,un,hub,popO=null,hmv=false,mv=false,hp=null,da=null,dr=null,cfA=null,T=0,tex=null,tt,fps=0;
let cam={x:0,y:0,z:40};

// ---------- мир ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(){
 let r=rng(seed);const M=N*N/1e4,c=N/2;ore=new Uint8Array(N*N);
 const blob=(t,cx,cy,rr)=>{const rad=rr+r()*2,q=Math.ceil(rad+1);
  for(let y=-q;y<=q;y++)for(let x=-q;x<=q;x++){
   const X=Math.round(cx+x),Y=Math.round(cy+y);
   if(X<0||Y<0||X>=N||Y>=N||(t>=5&&ore[Y*N+X]))continue;
   if(Math.hypot(x,y)<rad+r()*.9)ore[Y*N+X]=t}};
 for(let t=1;t<=4;t++){const a=t*1.57+r(),d=8+r()*4;
  blob(t,c+Math.cos(a)*d,c+Math.sin(a)*d,2.5);
  for(let i=0;i<7*M;i++)blob(t,6+r()*(N-12),6+r()*(N-12),2.5)}
 for(let i=0;i<4;i++){const a=i*1.57+.8,d=14+r()*4;blob(5,c+Math.cos(a)*d,c+Math.sin(a)*d,3.5)}
 for(let i=0;i<12*M;i++)blob(5,6+r()*(N-12),6+r()*(N-12),3.5);
 r=rng(seed^1234567);
 for(let t=6;t<=8;t++){const a=t*2.1,d=20+r()*8;blob(t,c+Math.cos(a)*d,c+Math.sin(a)*d,2);
  for(let i=0;i<3*M;i++)blob(t,6+r()*(N-12),6+r()*(N-12),2)}}
function reset(){g=new Array(N*N).fill(null);bl=[];hub=null}
function putHub(x,y){hub={t:'hub',x,y};for(let j=0;j<3;j++)for(let i=0;i<3;i++)g[(y+j)*N+x+i]=hub}
function at(x,y){return x<0||y<0||x>=N||y>=N?null:g[y*N+x]}
function mk(t,x,y,d){const o={t,x,y,d:d||0,it:0,p:0,inv:{},out:0,oi:0,w:-1,r:({work:4,saw:9,carp:10})[t]||0,rr:0,tm:0};bl.push(o);g[y*N+x]=o;return o}

// ---------- логика ----------
function accept(o,i,f){const n=R[o.r].in[i];if(!n||(o.inv[i]||0)>=n*2)return false;o.inv[i]=(o.inv[i]||0)+1;
 if(f)for(let k=0;k<4;k++)if(f.x==o.x+DX[k]&&f.y==o.y+DY[k])(o.ins=o.ins||[-99,-99,-99,-99])[k]=T;
 return true}
function give(n,item,from){
 if(n.t=='belt'){
  if(n.it||at(n.x+DX[n.d],n.y+DY[n.d])===from)return false;
  n.it=item;n.p=from.t=='belt'?0:.4;return true}
 if(n.t=='hub'){money+=I[item][2];sold++;return true}
 if(n.t=='split'){if(n.it)return false;n.it=item;n.p=0;return true}
 if(MT[n.t])return accept(n,item,from);
 return false}
function emit(o,item){
 for(let i=0;i<4;i++){const k=(o.rr+i)&3;if(o.ins&&T-o.ins[k]<20)continue;const n=at(o.x+DX[k],o.y+DY[k]);
  if(n&&n!==o&&give(n,item,o)){o.rr=(k+1)&3;return true}}
 return false}
function upd(dt){T+=dt;
 for(const o of bl){
  if(o.t=='belt'){
   if(o.it){o.p=Math.min(1,o.p+3*dt);
    if(o.p>=1){const n=at(o.x+DX[o.d],o.y+DY[o.d]);if(n&&give(n,o.it,o))o.it=0}}
  }else if(o.t=='split'){
   if(o.it){o.p=Math.min(1,o.p+6*dt);
    if(o.p>=1){const ds=[(o.d+1)&3,o.d,(o.d+3)&3];
     for(let i=0;i<3;i++){const k=(o.rr+i)%3,n=at(o.x+DX[ds[k]],o.y+DY[ds[k]]);
      if(n&&give(n,o.it,o)){o.rr=(k+1)%3;o.it=0;break}}}}
  }else if(o.t=='ext'){
   if(o.out){if(emit(o,o.oi))o.out=0}
   else{o.tm+=dt;if(o.tm>=5){o.tm=0;o.out=1;o.oi=OI[ore[o.y*N+o.x]]||ore[o.y*N+o.x]}}
  }else{
   const r=R[o.r];
   if(o.out&&emit(o,o.oi))o.out--;
   if(o.w>=0){o.w-=dt;if(o.w<=0){o.w=-1;o.out+=r.q;o.oi=r.out}}
   else if(!o.out){let ok=1;for(const k in r.in)if((o.inv[k]||0)<r.in[k])ok=0;
    if(ok){for(const k in r.in)o.inv[k]-=r.in[k];o.w=r.t}}
  }}}

// ---------- отрисовка ----------
function txt(s,x,y,sz){ctx.save();ctx.translate(x,y);ctx.scale(sz/100,sz/100);ctx.font='100px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,0,0);ctx.restore()}
function draw(){
 const z=cam.z;
 cam.x=Math.min(N-2,Math.max(2-W/z,cam.x));cam.y=Math.min(N-2,Math.max(2-H/z,cam.y));
 ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#141c17';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(z*dpr,0,0,z*dpr,-cam.x*z*dpr,-cam.y*z*dpr);
 ctx.fillStyle=tex||'#89b448';ctx.fillRect(0,0,N,N);
 const x0=Math.max(0,Math.floor(cam.x)),y0=Math.max(0,Math.floor(cam.y)),
  x1=Math.min(N,Math.ceil(cam.x+W/z)),y1=Math.min(N,Math.ceil(cam.y+H/z));
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const t=ore[y*N+x];
  if(t){ctx.fillStyle=(ico&&OB[t])||OC[t];ctx.fillRect(x+.06,y+.06,.88,.88);if(t==5){ctx.fillStyle='#5aa83e';ctx.beginPath();ctx.arc(x+.34,y+.4,.2,0,6.3);ctx.fill();ctx.beginPath();ctx.arc(x+.64,y+.6,.22,0,6.3);ctx.fill()}else if(t==4&&rk){ctx.drawImage(rk,0,0,62,34,x+.07,y+.27,.86,.47)}else if(ico&&OX[t]!==undefined){ctx.drawImage(ico,OX[t]*32,0,32,32,x+.08,y+.08,.84,.84)}else{ctx.fillStyle='#0003';ctx.fillRect(x+.3,y+.3,.4,.4)}}}
 if(z>22){ctx.strokeStyle='#ffffff12';ctx.lineWidth=1/z;ctx.beginPath();
  for(let x=x0;x<=x1;x++){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}
  for(let y=y0;y<=y1;y++){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}ctx.stroke()}
 ctx.strokeStyle='#5a7';ctx.lineWidth=.1;ctx.strokeRect(0,0,N,N);
 // хаб
 if(hub){const hx=hub.x,hy=hub.y;ctx.fillStyle='#6b5416';ctx.fillRect(hx+.05,hy+.05,2.9,2.9);
 ctx.strokeStyle='#ffd54a';ctx.lineWidth=.08;ctx.strokeRect(hx+.1,hy+.1,2.8,2.8);
 txt('💰',hx+1.5,hy+1.3,1.3);ctx.fillStyle='#ffd54a';txt('ХАБ',hx+1.5,hy+2.5,.5)}
 if(hp){ctx.globalAlpha=.6;ctx.fillStyle='#6b5416';ctx.fillRect(hp.x+.05,hp.y+.05,2.9,2.9);ctx.globalAlpha=1;
  ctx.strokeStyle='#ffd54a';ctx.lineWidth=.08;ctx.setLineDash([.25,.15]);ctx.strokeRect(hp.x+.1,hp.y+.1,2.8,2.8);ctx.setLineDash([]);txt('💰',hp.x+1.5,hp.y+1.5,1.3)}
 const vis=[];
 for(const o of bl){if(o.x<x0-1||o.x>x1||o.y<y0-1||o.y>y1)continue;
  if(o.t=='belt'||o.t=='split'){
   ctx.fillStyle=o.t=='belt'?'#39414a':'#4b3d63';ctx.fillRect(o.x+.04,o.y+.04,.92,.92);
   ctx.save();ctx.translate(o.x+.5,o.y+.5);ctx.rotate(o.d*Math.PI/2);
   ctx.strokeStyle=o.t=='belt'?'#7d8a99':'#d2c2ff';ctx.lineWidth=.07;ctx.beginPath();
   if(o.t=='belt'){ctx.moveTo(-.12,-.2);ctx.lineTo(.14,0);ctx.lineTo(-.12,.2)}
   else{ctx.moveTo(-.3,0);ctx.lineTo(.3,0);ctx.moveTo(0,-.3);ctx.lineTo(0,.3);ctx.moveTo(.15,-.12);ctx.lineTo(.3,0);ctx.lineTo(.15,.12)}
   ctx.stroke();ctx.restore();
   if(o.it)vis.push(o);
  }else{
   ctx.fillStyle=({ext:'#4a4f66',smelt:'#7a3b22',work:'#26507a',saw:'#6b4a2a',carp:'#7a5b8a'})[o.t];
   ctx.fillRect(o.x+.06,o.y+.06,.88,.88);
   if(o.t=='ext'){ctx.strokeStyle=OC[ore[o.y*N+o.x]];ctx.lineWidth=.07;ctx.strokeRect(o.x+.1,o.y+.1,.8,.8)}
   ctx.fillStyle='#fff';txt(({ext:'⛏',smelt:'🔥',work:'🔧',saw:'🪚',carp:'🪑'})[o.t],o.x+.5,o.y+.5,.5);
   if(o.t!='ext'&&o.w>=0){ctx.fillStyle='#ffd54a';ctx.fillRect(o.x+.1,o.y+.84,.8*(1-o.w/R[o.r].t),.07)}
   if(o.out){ctx.fillStyle=I[o.oi][1];ctx.fillRect(o.x+.68,o.y+.1,.2,.2)}
  }}
 for(const o of vis){const f=o.t=='belt'?o.p-.5:0,px=o.x+.5+DX[o.d]*f,py=o.y+.5+DY[o.d]*f;
  if(rk&&o.it==4){ctx.drawImage(rk,62,0,52,26,px-.26,py-.13,.52,.26);continue}if(ico&&IX[o.it]!==undefined){ctx.drawImage(ico,IX[o.it]*32,0,32,32,px-.22,py-.22,.44,.44);continue}ctx.fillStyle=I[o.it][1];ctx.fillRect(px-.14,py-.14,.28,.28);
  ctx.strokeStyle='#000a';ctx.lineWidth=.03;ctx.strokeRect(px-.14,py-.14,.28,.28)}
 if(da){const a=dr||{x0:da.x,y0:da.y,x1:da.x,y1:da.y},w=a.x1-a.x0+1,h=a.y1-a.y0+1;
  ctx.fillStyle='#ff3b3055';ctx.fillRect(a.x0,a.y0,w,h);ctx.strokeStyle='#ff5a4d';ctx.lineWidth=.08;ctx.strokeRect(a.x0,a.y0,w,h)}
}

// ---------- интерфейс ----------
const BT=[['hub','🏛','Хаб'],['ext','⛏','Экстрактор'],['belt','➡️','Лента'],['split','🔀','Разветвитель'],['smelt','🔥','Плавильня'],['work','🔧','Мастерская'],['saw','🪚','Лесопилка'],['carp','🪑','Столярная']];
const bt=t=>`<button data-t="${t[0]}"><b>${t[1]}</b>${t[2]}<br>${C[t[0]]?'$'+C[t[0]]:'бесплатно'}</button>`;
const sb=(t,i,n)=>`<button data-t="${t}"><b>${i}</b>${n}</button>`;
$('bar').innerHTML=sb('sel','👆','Выбор')+'<button id="hm"><b>🔨</b>Стройка</button>'+sb('rot','🔄','Поворот')+sb('del','🗑','Снос')+sb('dela','🧹','Область')+'<button id="dir"><b></b>Направление</button>';
function panel(open){const p=$('bp');p.style.display=open?'flex':'none';if(open)p.innerHTML=BT.filter(t=>t[0]!='hub'||!hub).map(bt).join('');bar()}
function bar(){if(tool!='dela')da=dr=null;if(cfA){cfA=null;$('cq').innerHTML=HQ;$('cf').style.display='none'}if(tool!='hub'){mv=false;if(hp){hp=null;$('cf').style.display='none'}}document.querySelectorAll('#bar [data-t],#bp [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tool));
 $('hm').classList.toggle('on',$('bp').style.display=='flex'||BT.some(t=>t[0]==tool));$('dir').firstChild.textContent=ARR[cur]}
$('bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='hm')return panel($('bp').style.display!='flex');
 if(b.id=='dir')cur=(cur+1)&3;else{tool=b.dataset.t;$('bp').style.display='none'}bar()};
$('bp').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;panel(false)};
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1600)}
function hud(){$('m').textContent='💰 $'+Math.floor(money);$('f').textContent=fps+' FPS';if(popO)status()}
function status(){const o=popO;let s='';
 if(o.t=='hub')s='Хаб продаёт всё, что сюда привезли.<br>Продано предметов: '+sold+'<br>Перемещение хаба: '+(hmv?'уже использовано':'доступно 1 раз');else if(o.t=='ext')s='Добывает: '+ON[ore[o.y*N+o.x]]+' (бесконечно)';
 else{const r=R[o.r];
  s='Рецепт: <b>'+r.n+'</b><br>Склад: '+(Object.keys(o.inv).filter(k=>o.inv[k]).map(k=>I[k][0]+' ×'+o.inv[k]).join(', ')||'пусто')+
  '<br>'+(o.w>=0?'Работает: '+Math.round((1-o.w/r.t)*100)+'%':'Ожидает ресурсы')+(o.out?'<br>На выходе: '+I[o.oi][0]+' ×'+o.out:'')}
 $('ps').innerHTML=s}
function buttons(){const o=popO;
 $('pr').innerHTML=o.t=='hub'?(hmv?'':'<button data-mv="1">🚚 Передвинуть хаб (1 раз)</button>'):o.t=='ext'?'':R.filter(r=>r.m==MT[o.t]).map(r=>
  `<button data-i="${r.id}" class="${o.r==r.id?'on':''}">${un.has(r.id)?'':'🔒 $'+r.c+' · '}${r.n}: ${Object.entries(r.in).map(([k,v])=>v+'×'+I[k][0]).join(' + ')} → ${r.q}×</button>`).join('')}
function openPop(o){popO=o;$('pt').textContent=NM[o.t];status();buttons();$('pop').style.display='block'}
function closePop(){popO=null;$('pop').style.display='none'}
$('pc').onclick=closePop;
const HQ=$('cq').innerHTML;
function ask(t,f){cfA=f;$('cq').innerHTML=t;$('cf').style.display='block'}
$('cy').onclick=()=>{if(cfA){const f=cfA;cfA=null;$('cq').innerHTML=HQ;$('cf').style.display='none';f();bar();return}if(hp){
 if(mv&&hub){for(let j=0;j<3;j++)for(let i=0;i<3;i++)g[(hub.y+j)*N+hub.x+i]=null;hub=null;mv=false;hmv=true}
 if(!hub){putHub(hp.x,hp.y);tool='sel';toast('Хаб поставлен! Теперь стройте добычу и ленты')}}
 hp=null;$('cf').style.display='none';bar()};
$('cn').onclick=()=>{cfA=null;da=dr=null;$('cq').innerHTML=HQ;hp=null;$('cf').style.display='none';if(mv){mv=false;tool='sel';bar()}};
$('pr').onclick=e=>{const b=e.target.closest('button');if(!b||!popO)return;if(b.dataset.mv){mv=true;tool='hub';closePop();bar();toast('Тапните новое место для хаба');return}const r=R[b.dataset.i];
 if(!un.has(r.id)){if(money<r.c)return toast('Не хватает денег: нужно $'+r.c);money-=r.c;un.add(r.id);toast('Рецепт открыт: '+r.n)}
 else{popO.r=r.id;popO.w=-1;popO.out=0;popO.inv={};popO.ins=null}
 buttons();hud()};
$('nr').onclick=()=>{if(confirm('Начать новую игру? Прогресс будет удалён.')){localStorage.removeItem('bld2');location.reload()}};

function rm(o){
 if(o.t=='hub'){for(let j=0;j<3;j++)for(let i=0;i<3;i++)g[(o.y+j)*N+o.x+i]=null;hub=null;mv=false}
 else{g[o.y*N+o.x]=null;bl.splice(bl.indexOf(o),1);money+=Math.floor(C[o.t]/2)}
 if(popO===o)closePop()}
function tap(sx,sy){
 const x=Math.floor(sx/cam.z+cam.x),y=Math.floor(sy/cam.z+cam.y);
 if(x<0||y<0||x>=N||y>=N)return;
 const c=at(x,y),m=c&&(c.t=='ext'||MT[c.t]);
 if(tool=='hub'){
  if(hub&&!mv)return toast('Хаб можно поставить только один раз');
  if(x<1||y<1||x>=N-1||y>=N-1)return toast('Хаб не помещается у края карты');
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){const q=g[(y-1+j)*N+x-1+i];if(q&&q!==hub)return toast('Место занято')}
  hp={x:x-1,y:y-1};$('cf').style.display='block';return}
 if(!hub&&!['sel','del','dela','rot'].includes(tool))return toast('Сначала поставьте хаб: 🔨 → Хаб');
 if(tool=='sel'){
  if(m||(c&&c.t=='hub'))openPop(c);else toast(c?(c.t=='hub'?'Хаб: продаёт всё, что сюда привезли':NM[c.t]):ore[y*N+x]?ON[ore[y*N+x]]+' (бесконечно)':'Пусто');return}
 if(tool=='del'){
  if(!c)return;
  if(c.t=='hub')return ask('Снести хаб? Продажа остановится, пока вы не поставите его снова.',()=>{rm(c);hud();toast('Хаб снесён. Поставить новый: 🔨 → Хаб')});
  rm(c);hud();return}
 if(tool=='dela'){
  if(!da){da={x,y};dr=null;toast('Тапните вторую точку области');return}
  const x0=Math.min(da.x,x),x1=Math.max(da.x,x),y0=Math.min(da.y,y),y1=Math.max(da.y,y),st=new Set();
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){const q=g[j*N+i];if(q)st.add(q)}
  if(!st.size){da=null;return toast('В этой области ничего нет')}
  dr={x0,y0,x1,y1};
  ask('Снести построек: '+st.size+(st.has(hub)?' (вместе с хабом)':'')+'?',()=>{st.forEach(rm);da=dr=null;hud();toast('Снесено: '+st.size)});return}
 if(tool=='rot'){if(c&&(c.t=='belt'||c.t=='split'))c.d=(c.d+1)&3;else toast('Нажмите на ленту или разветвитель');return}
 if(c){
  if(m)return openPop(c);
  if(c.t==tool&&(tool=='belt'||tool=='split')){c.d=cur;return}
  return toast('Клетка занята')}
 if(tool=='ext'&&!ore[y*N+x])return toast('Экстрактор ставится на руду');
 if(money<C[tool])return toast('Не хватает денег: нужно $'+C[tool]);
 money-=C[tool];mk(tool,x,y,cur);hud()}

// ---------- жесты ----------
const P=new Map();let pinch=0,moved=0,pd=1,pc={x:0,y:0};
const clampZ=z=>Math.min(90,Math.max(6,z));
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(P.size==1){moved=0;pinch=0}
 else{pinch=1;const[a,b]=[...P.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)||1;pc={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}};
cv.onpointermove=e=>{const p=P.get(e.pointerId);if(!p)return;
 if(P.size==1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>10&&!pinch){cam.x-=dx/cam.z;cam.y-=dy/cam.z}p.x=e.clientX;p.y=e.clientY}
 else if(P.size==2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...P.values()];
  const d=Math.hypot(a.x-b.x,a.y-b.y)||1,c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  const wx=pc.x/cam.z+cam.x,wy=pc.y/cam.z+cam.y;
  cam.z=clampZ(cam.z*d/pd);cam.x=wx-c.x/cam.z;cam.y=wy-c.y/cam.z;pd=d;pc=c;moved=99}};
const up=e=>{if(!P.has(e.pointerId))return;const was=P.size;P.delete(e.pointerId);
 if(was==1&&!pinch&&moved<=10&&e.type=='pointerup')tap(e.clientX,e.clientY);
 if(!P.size)pinch=0};
cv.onpointerup=up;cv.onpointercancel=up;
cv.onwheel=e=>{e.preventDefault();const wx=e.clientX/cam.z+cam.x,wy=e.clientY/cam.z+cam.y;
 cam.z=clampZ(cam.z*(e.deltaY<0?1.15:.87));cam.x=wx-e.clientX/cam.z;cam.y=wy-e.clientY/cam.z};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

function save(){try{localStorage.setItem('bld2',JSON.stringify({seed,money,sold,un:[...un],cam,hub:hub&&{x:hub.x,y:hub.y},hm:hmv,
 b:bl.map(o=>({t:o.t,x:o.x,y:o.y,d:o.d,r:o.r,inv:o.inv,out:o.out,oi:o.oi,w:o.w,it:o.it,p:o.p}))}))}catch(e){}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

function boot(){
 let s=null;try{s=JSON.parse(localStorage.getItem('bld2'))}catch(e){}
 resize();seed=s?s.seed:(Math.random()*1e9|0);reset();gen();
 un=new Set([...(s?s.un:[]),...R.filter(r=>!r.c).map(r=>r.id)]);
 if(s){const h=s.hub===undefined?{x:49,y:49}:s.hub;if(h)putHub(h.x,h.y);money=s.money;hmv=!!s.hm;sold=s.sold||0;for(const q of s.b){const o=mk(q.t,q.x,q.y,q.d);Object.assign(o,q)}cam=s.cam}
 else{cam.x=N/2-W/cam.z/2;cam.y=N/2-H/cam.z/2}
 if(!hub){tool='hub';toast('Нажмите на карту — туда встанет хаб (один раз)')}
 bar();hud()}
